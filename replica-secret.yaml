apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: secret-replicaset
spec:
  replicas: 2
  selector :
    matchLabels:
      app: alpine
  template:
    metadata:
      labels:
        app: alpine
    spec:
      containers:
      - name: demo
        image: alpine
        command: ["sleep", "3600"]
        volumeMounts:
        - name: kg-secret
          mountPath: "/config"
          readOnly: true
      volumes:
      - name: kg-secret
        secret:
          secretName: new-secret
