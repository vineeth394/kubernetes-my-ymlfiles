apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: configmap-replicaset
spec:
  replicas: 2
  selector :
    matchLabels:
      app: alpine
  template:
    metadata:
      labels:
        app: alpine
    spec:
      containers:
      - name: demo
        image: alpine
        command: ["sleep", "3600"]
        volumeMounts:
        - name: config
          mountPath: "/config"
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: multi-config
